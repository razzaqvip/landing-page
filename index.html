<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #5E7AC4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
      width: 320px;
      padding: 40px 20px;
      text-align: center;
      box-sizing: border-box;
    }

    .header-logo img {
      max-width: 180px;
      height: auto;
      margin-bottom: 30px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    .menu-btn {
      display: block;
      width: 100%;
      padding: 15px 0;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      transition: 0.3s;
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-sizing: border-box;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .btn-order {
      background: rgba(255, 49, 49, 0.3); 
      border: 1px solid rgba(255, 49, 49, 0.5);
    }

    .btn-order:hover {
      background: rgba(255, 49, 49, 0.5);
    }

    #lokasi-view {
      display: none;
    }

    .house-img {
      width: 100%;
      border-radius: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Ukuran Iframe Map otomatis menyesuaikan card */
    .map-frame {
      width: 100%;
      height: 250px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .back-btn {
      margin-top: 15px;
      background: none;
      border: 1px solid white;
      color: white;
      padding: 10px 20px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div id="main-menu">
    <div class="header-logo">
      <img src="logo.png" alt="Rembang Setrika Express">
    </div>

    <button class="menu-btn" onclick="showLocation()">📍 Lokasi</button>
    <a href="https://razzaqvip.github.io/rseorder/" class="menu-btn btn-order">🚀 Order</a>
    <a href="https://wa.me/628979346633" class="menu-btn">💬 Kritik & Saran</a>
  </div>

  <div id="lokasi-view">
    <h3 style="color: white; margin-top: 0;">Workshop Kami</h3>
    <img src="rumah.jpg" class="house-img" alt="Foto Rumah">
    
    <iframe 
      class="map-frame"
      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d247.65898154651578!2d111.34030243859159!3d-6.70329149268619!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sid!4v1776789260985!5m2!1sen!2sid" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <button class="back-btn" onclick="showMenu()">← Kembali</button>
  </div>
</div>

<script>
  function showLocation() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('lokasi-view').style.display = 'block';
  }

  function showMenu() {
    document.getElementById('main-menu').style.display = 'block';
    document.getElementById('lokasi-view').style.display = 'none';
  }
</script>

</body>
</html>
